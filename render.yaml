services:
  - type: web
    name: tigertowntogo
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 12 --timeout 60 --bind 0.0.0.0:$PORT
    disk:
      name: tigertowntogo-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/delivery.db
      - key: TZ
        value: America/Chicago
      - key: SUBDOMAIN_ROUTING
        value: "1"
      - key: SECRET_KEY
        generateValue: true
