{% extends "base.html" %}{% block body %}
<div class="head"><h1>{{ r['name'] }} account</h1>
  <div><a class="btn small" href="/restaurant">Orders</a>
       <a class="btn small" href="/restaurant/logout">Sign out</a></div></div>
<div class="panel">
  <h2>Store login</h2>
  <p class="muted small">This is what you type on the sign in screen. Change the store code or PIN here
  and use the new pair next time. Dispatch can also reset it for you.</p>
  <div class="row"><label>Store name</label><input id="rName" value="{{ r['name'] }}"></div>
  <div class="row"><label>Store code</label><input id="rSlug" value="{{ r['slug'] }}"></div>
  <div class="row"><label>Phone</label><input id="rPhone" value="{{ r['phone'] or '' }}"></div>
  <div class="row"><label>New PIN</label>
    <input id="rPin" type="password" placeholder="leave blank to keep the current one"></div>
  <button class="btn primary" onclick="saveAcct()">Save</button>
  <span class="muted small" id="acctMsg"></span>
</div>
<script>
async function saveAcct(){
  const r = await fetch('/api/restaurant/account', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name:rName.value, slug:rSlug.value, phone:rPhone.value, pin:rPin.value})});
  const res = await r.json();
  acctMsg.textContent = res.ok ? ('Saved. Sign in with ' + res.slug + ' from now on.')
                               : (res.error || 'Could not save that.');
  rPin.value = '';
}
</script>
{% endblock %}
