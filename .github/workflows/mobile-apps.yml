name: Build phone apps (driver + kitchen)

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Your live site address"
        required: false
        default: "https://tigertowntogo.up.railway.app"

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [driver, kitchen]
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    env:
      SITE_URL: ${{ inputs.site_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - run: npm run assets -- --android
      - name: Location and notification permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application#' $M
      - run: npx cap sync android
      - name: Build test app (APK) and store bundle (AAB)
        working-directory: mobile/${{ matrix.app }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.app }}
          path: |
            mobile/${{ matrix.app }}/android/app/build/outputs/apk/debug/*.apk
            mobile/${{ matrix.app }}/android/app/build/outputs/bundle/release/*.aab

  ios:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app: [driver, kitchen]
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    env:
      SITE_URL: ${{ inputs.site_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx cap add ios
      - run: npm run assets -- --ios
      - name: Location permission text
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Your location shows dispatch where you are so they can send you nearby orders and track deliveries.'" $P
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string 'Your location keeps updating for dispatch while you are on a delivery, even with the screen off.'" $P
      - run: npx cap sync ios
      - name: Check the iPhone app builds (unsigned)
        working-directory: mobile/${{ matrix.app }}/ios/App
        run: |
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release -sdk iphonesimulator \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Zip the Xcode project for signing on a Mac
        run: zip -qr ios-${{ matrix.app }}-xcode.zip ios -x "ios/App/build/*"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.app }}-xcode
          path: mobile/${{ matrix.app }}/ios-${{ matrix.app }}-xcode.zip
