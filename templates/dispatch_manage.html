{% extends "base.html" %}{% block body %}
<div class="head">
  <h1>Restaurants and drivers</h1>
  <div class="row">
    <a class="btn" href="/dispatch">Back to board</a>
    <a class="btn" href="/dispatch/restaurants">Hours</a>
    <a class="btn" href="/dispatch/regions">Regions</a>
  </div>
</div>

<div class="cols">
  <section>
    <h2>Restaurants</h2>
    <div id="restStatus"><p class="muted small">Loading...</p></div>
    <div class="card pad">
      <h3>Add a restaurant</h3>
      <input id="rName" placeholder="Name, e.g. Popeyes Chicken">
      <input id="rAddr" placeholder="Street address, city, state, zip">
      <div class="row">
        <input id="rPhone" placeholder="Phone">
        <input id="rPin" placeholder="Login PIN (default 1111)">
        <input id="rPrep" type="number" placeholder="Prep min" value="15">
      </div>
      <button class="btn primary" onclick="addRest()">Add restaurant</button>
      <p class="muted" id="rMsg"></p>
    </div>
    <div id="rests"></div>
  </section>

  <section>
    <h2>Drivers</h2>
    <div class="card pad">
      <h3>Add a driver</h3>
      <div class="row">
        <input id="dName" placeholder="Name">
        <input id="dPhone" placeholder="Phone, 10 digits">
        <input id="dPin" placeholder="Password / PIN">
      </div>
      <button class="btn primary" onclick="addDriver()">Add driver</button>
      <p class="muted" id="dMsg"></p>
    </div>
    <div id="drivers"><p class="muted small">Loading drivers...</p></div>
  </section>
</div>
{% endblock %}
{% block scripts %}<script>
let BRANCH_ACCTS = [];
async function jpost(u, b){ const r = await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},
  body: JSON.stringify(b)}); return r.json(); }
async function jget(u){ const r = await fetch(u); return r.json(); }
function dollars(v){ return Math.round(parseFloat(String(v).replace(/[^0-9.\-]/g,'')||0)*100); }

// open / paused / 24h list with quick buttons (moved here from the board)
async function loadStatus(){
  const res = await jget('/api/dispatch/board');
  if(!res.ok) return;
  document.getElementById('restStatus').innerHTML = (res.restaurants||[]).map(r=>
    '<div class="driver"><div><strong>'+r.name+'</strong> <span class="pill '+
    (r.paused?'red':r.open?'green':'grey')+'">'+
    (r.paused?'paused':r.open?'open':'closed')+'</span>'+
    '<div class="muted small">'+r.hours+'</div></div>'+
    '<div><button class="btn tiny" onclick="pauseRest('+r.id+')">'+(r.paused?'Resume':'Pause')+'</button>'+
    '<a class="btn tiny" href="/dispatch/restaurants">Hours</a>'+
    '<a class="btn tiny" href="/dispatch/menu/'+r.id+'">Menu</a></div></div>').join('') ||
    '<p class="muted">No restaurants yet.</p>';
}
async function open24(id){ await jpost('/api/restaurant/open24', {restaurant_id:id}); loadStatus(); }
async function pauseRest(id){ await jpost('/api/dispatch/pause-restaurant', {restaurant_id:id}); loadStatus(); }
loadStatus(); setInterval(function(){ loadStatus().catch(function(){}); }, 15000);

// Drivers load on their own (no menus), so the list shows right away.
function showDrivers(res){
  BRANCH_ACCTS = res.branch_accounts || [];
  try { drawDrivers(res); }
  catch(e){ console.error('drivers list', e); document.getElementById('drivers').innerHTML = '<p class="muted">The driver list hit a problem: '+esc(e.message)+'</p>'; }
}
async function loadDrivers(){
  let res;
  try { res = await jget('/api/dispatch/drivers-manage'); }
  catch(e){ document.getElementById('drivers').innerHTML = '<p class="muted">Could not load drivers. Refresh the page.</p>'; return; }
  if(!res.ok){ window.location='/dispatch/login'; return; }
  showDrivers(res);
}
async function loadRests(){
  let res;
  try { res = await jget('/api/dispatch/catalog'); } catch(e){ return; }
  if(!res.ok) return;
  try { drawRests(res); } catch(e){ console.error('restaurant list', e); }
}
function load(){ loadDrivers(); loadRests(); }
function drawRests(res){
  document.getElementById('rests').innerHTML = (res.restaurants||[]).map(r=>{
    r.items = r.items || [];
    const items = r.items.map(it=>{
      const groups = (it.groups||[]).map(g=>{ g.options = g.options || []; return g; }).map(g=>
        '<div class="layer"><strong>'+g.name+'</strong> <span class="muted">pick '+g.min+
        (g.max>g.min?(' to '+g.max):'')+'</span> '+
        '<button class="btn tiny" onclick="delGroup('+g.id+')">Remove layer</button>'+
        '<div>'+ (g.options.map(o=>
          '<span class="optchip">'+o.name+(o.delta_cents?(' +'+o.delta):'')+
          ' <a href="#" onclick="delOption('+o.id+');return false;">x</a></span>').join('') || '<span class="muted">no choices yet</span>') +
        '</div>'+
        '<div class="row"><input id="on'+g.id+'" placeholder="Choice, e.g. Red beans and rice">'+
        '<input id="op'+g.id+'" placeholder="+$0.00" style="max-width:90px">'+
        '<button class="btn tiny" onclick="addOption('+g.id+')">Add choice</button></div></div>').join('');
      return '<div class="menuitem"><div class="row between"><div><strong>'+it.name+'</strong> '+it.price+
        (it.active?'':' <span class="pill grey">off</span>')+
        '<div class="muted">'+(it.description||'')+'</div></div>'+
        '<div class="row"><button class="btn tiny" onclick="toggleItem('+it.id+')">'+
        (it.active?'Hide':'Show')+'</button>'+
        '<button class="btn tiny" onclick="delItem('+it.id+')">Delete</button></div></div>'+
        groups +
        '<div class="row"><input id="gn'+it.id+'" placeholder="Sub layer, e.g. Pick your side">'+
        '<input id="gmin'+it.id+'" type="number" value="1" style="max-width:70px" title="min picks">'+
        '<input id="gmax'+it.id+'" type="number" value="1" style="max-width:70px" title="max picks">'+
        '<button class="btn tiny" onclick="addGroup('+it.id+')">Add sub layer</button></div></div>';
    }).join('');
    return '<div class="card pad"><div class="row between"><div><h3>'+r.name+'</h3>'+
      '<div class="muted">'+r.address+'  |  login '+r.slug+'</div></div>'+
      '<div class="row"><a class="btn tiny" href="/dispatch/menu/'+r.id+'">Quick menu</a>'+
      '<button class="btn tiny" onclick="editLogin('+r.id+",'"+r.slug+"'"+')">Edit login</button>'+
      '<button class="btn tiny danger" onclick="delRest('+r.id+",'"+r.name.replace(/'/g,"")+"'"+')">Delete</button></div></div>'+
      items +
      '<div class="row"><input id="in'+r.id+'" placeholder="Item, e.g. 3 pc Combo">'+
      '<input id="ip'+r.id+'" placeholder="$0.00" style="max-width:90px">'+
      '<input id="id'+r.id+'" placeholder="Description">'+
      '<button class="btn tiny" onclick="addItem('+r.id+')">Add item</button></div></div>';
  }).join('');
}
function drawDrivers(res){
  document.getElementById('drivers').innerHTML = ((res.drivers||[]).map(d=>{
    const L = d.locked, dis = L ? ' disabled' : '';
    const lockRow = res.owner ? '' : (L
      ? '<div class="row"><span class="pill grey">Locked</span>'+
        (d.unlock_block ? '<span class="muted small">'+esc(d.unlock_block)+'</span>'
                        : '<button class="btn tiny" onclick="unlockDriver('+d.id+')">Unlock to edit</button>')+'</div>'
      : '<div class="row"><span class="pill green">Unlocked</span><span class="muted small">Locks again after you save, or in 15 minutes.</span>'+
        '<button class="btn tiny" onclick="lockDriver('+d.id+')">Lock</button></div>');
    return '<div class="card pad"><div class="row between"><div><strong>'+esc(d.name)+'</strong> '+
    '<span class="pill '+(d.status==='online'?'green':(d.status==='break'?'amber':'grey'))+'">'+d.status+'</span>'+
    (d.active ? '' : ' <span class="pill amber">Inactive</span>')+
    '<div class="muted">'+d.active_orders+' live order(s) &middot; '+esc(d.regions_label)+'</div></div>'+
    '<span><button class="btn tiny" onclick="setActive('+d.id+','+(d.active?0:1)+')">'+(d.active?'Make inactive':'Make active')+'</button>'+
    (L ? '' : '<button class="btn tiny danger" onclick="delDriver('+d.id+",'"+d.name.replace(/'/g,"")+"'"+')">Delete</button>')+'</span></div>'+
    lockRow+
    '<div class="row" style="align-items:flex-end">'+
    '<label class="small" style="flex:1;min-width:140px">Driver name<input id="dn'+d.id+'" value="'+esc(d.name)+'"'+dis+'></label>'+
    '<label class="small" style="flex:1;min-width:140px">Driver phone (10 digits)<input id="dp'+d.id+'" value="'+esc(d.phone)+'" placeholder="3345551234"'+dis+'></label>'+
    '<label class="small" style="flex:1;min-width:140px">Driver app password / PIN<input id="dk'+d.id+'" value="'+esc(d.pin)+'" placeholder="What the driver signs in with"'+dis+'></label>'+
    (L ? '' : '<button class="btn tiny" onclick="saveDriver('+d.id+')">Save</button>')+'</div>'+
    '<div class="paybox" style="border-top:1px solid #eee;padding-top:8px;margin-top:6px">'+
    '<label class="small" style="display:block;max-width:260px"><strong>How do you pay this driver?</strong>'+
    '<select id="dw'+d.id+'" onchange="payShow('+d.id+')"'+dis+'><option value="paypal"'+(['venmo','check','branch'].indexOf(d.payout_wallet)<0?' selected':'')+'>PayPal</option>'+
    '<option value="venmo"'+(d.payout_wallet==='venmo'?' selected':'')+'>Venmo</option>'+
    '<option value="branch"'+(d.payout_wallet==='branch'?' selected':'')+'>Branch</option>'+
    '<option value="check"'+(d.payout_wallet==='check'?' selected':'')+'>Check (pay by hand)</option></select></label>'+
    '<div id="pf_paypal'+d.id+'" class="payfield"><label class="small" style="display:block"><strong>Driver\'s PayPal email</strong>'+
      '<input id="de'+d.id+'" type="email" value="'+esc(d.payout_email||'')+'" placeholder="driver@example.com"'+dis+'></label>'+
      '<div class="muted small">The email address the driver uses to sign in to their own PayPal account. Their pay is sent there. Ask the driver for it.</div></div>'+
    '<div id="pf_venmo'+d.id+'" class="payfield"><label class="small" style="display:block"><strong>Driver\'s Venmo phone number</strong>'+
      '<input id="dv'+d.id+'" value="'+esc(d.payout_phone||'')+'" placeholder="3345551234"'+dis+'></label>'+
      '<div class="muted small">The 10 digit phone number on the driver\'s Venmo account. Leave it empty if it is the same as the driver phone above.</div></div>'+
    '<div id="pf_branch'+d.id+'" class="payfield"><label class="small" style="display:block"><strong>Driver\'s Branch worker ID</strong>'+
      '<input id="dbr'+d.id+'" value="'+esc(d.payout_branch_id||'')+'" placeholder="Worker ID from Branch"'+dis+'></label>'+
      '<div class="muted small">Not the driver\'s phone or email. Sign in to your company\'s Branch dashboard, open Workers, find this driver and copy their Worker ID (some screens call it Employee ID). The driver must already be added as a worker in Branch.</div>'+
      (BRANCH_ACCTS.length ? '<label class="small" style="display:block;margin-top:6px"><strong>Pay from which Branch account?</strong><select id="dba'+d.id+'"'+dis+'><option value="0">The account for the order\'s brand (usual)</option>'+
        BRANCH_ACCTS.map(a=>'<option value="'+a.id+'"'+(d.branch_account_id===a.id?' selected':'')+'>'+esc(a.name)+'</option>').join('')+'</select></label>'
        : '<div class="small" style="color:#c0392b;margin-top:4px">No Branch account is set up yet. An owner adds it in Settings, under Branch accounts. Until then this driver is paid by hand.</div>')+
      (BRANCH_ACCTS.length > 1 ? '<div class="muted small" style="margin-top:6px">Only if the driver has a different Worker ID at another company:</div>'+BRANCH_ACCTS.map(a=>'<label class="small" style="display:block">Worker ID at '+esc(a.name)+' (leave empty to use the one above)<input id="dbw'+d.id+'_'+a.id+'" value="'+esc((d.payout_branch_ids||{})[String(a.id)]||'')+'"'+dis+'></label>').join('') : '')+
    '</div>'+
    '<div id="pf_check'+d.id+'" class="payfield"><div class="muted small">Nothing to fill in. You pay this driver yourself and mark the trip Paid by check.</div></div>'+
    '<label class="small" style="display:flex;gap:6px;align-items:center;margin-top:6px"><input type="checkbox" id="dap'+d.id+'" style="width:auto"'+(d.auto_pay?' checked':'')+dis+'> Auto pay: send this driver\'s pay automatically after each delivered trip</label>'+
    '</div>'+
    '<div class="row"><span class="muted small">Bank (for your records)</span>'+
    '<input id="dbn'+d.id+'" value="'+esc(d.bank_name||'')+'" placeholder="Bank name, like Regions" style="max-width:180px"'+dis+'>'+
    '<input id="dbl'+d.id+'" value="'+esc(d.bank_last4||'')+'" placeholder="Last 4 of account" maxlength="4" style="max-width:130px"'+dis+'>'+
    '<span class="muted small">Only the last 4. Never save full account or routing numbers here.</span></div></div>';
  }).join('')) || '<p class="muted">No drivers yet. Add one above.</p>';
  (res.drivers||[]).forEach(d=>payShow(d.id));
}
function payShow(id){
  const sel = document.getElementById('dw'+id); if(!sel) return;
  ['paypal','venmo','branch','check'].forEach(w=>{
    const el = document.getElementById('pf_'+w+id); if(el) el.style.display = (sel.value===w) ? '' : 'none';
  });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function unlockDriver(id){
  const old = document.getElementById('unlockModal'); if (old) old.remove();
  const m = document.createElement('div'); m.id = 'unlockModal'; m.className = 'delmodal';
  m.innerHTML = '<div class="delbox"><h3>Unlock driver</h3><p class="muted small">Enter your own dispatch username and password.</p>'+
    '<input id="ulUser" placeholder="Username" autocomplete="username">'+
    '<input id="ulPw" type="password" placeholder="Password" autocomplete="current-password">'+
    '<div id="ulMsg" class="muted small"></div><div class="row">'+
    '<button class="btn primary" id="ulGo">Unlock</button>'+
    '<button class="btn" onclick="document.getElementById(\'unlockModal\').remove()">Cancel</button></div></div>';
  document.body.appendChild(m);
  document.getElementById('ulUser').focus();
  document.getElementById('ulPw').addEventListener('keydown', e=>{ if (e.key==='Enter') document.getElementById('ulGo').click(); });
  document.getElementById('ulGo').onclick = async ()=>{
    const r = await jpost('/api/dispatch/driver-unlock', {driver_id:id,
      username: document.getElementById('ulUser').value, password: document.getElementById('ulPw').value});
    if (!r.ok){ document.getElementById('ulMsg').textContent = r.error || 'Could not unlock.'; document.getElementById('ulPw').value=''; return; }
    m.remove(); loadDrivers();
  };
}
async function lockDriver(id){ await jpost('/api/dispatch/driver-unlock', {driver_id:id, op:'lock'}); loadDrivers(); }

async function addRest(){
  const res = await jpost('/api/dispatch/restaurant', {op:'create',
    name:document.getElementById('rName').value, address:document.getElementById('rAddr').value,
    phone:document.getElementById('rPhone').value, pin:document.getElementById('rPin').value,
    prep_default:parseInt(document.getElementById('rPrep').value||'15',10)});
  document.getElementById('rMsg').textContent = res.ok
    ? ('Added. Kitchen login code: '+res.slug + (res.geocoded?'':'  (address could not be verified, fees will need the address fixed)'))
    : (res.error||'Could not add that one.');
  if(res.ok){ document.getElementById('rName').value=''; document.getElementById('rAddr').value=''; load(); }
}
async function editLogin(id, slug){
  const code = prompt('Store code the restaurant signs in with', slug);
  if(code === null) return;
  const pin = prompt('New PIN (blank keeps the current one)', '');
  if(pin === null) return;
  const body = {op:'update', restaurant_id:id, slug:code};
  if(pin.trim()) body.pin = pin.trim();
  const res = await jpost('/api/dispatch/restaurant', body);
  if(!res.ok){ alert(res.error || 'Could not save that login.'); return; }
  load();
}
async function delRest(id, name){
  if(!confirm('Delete '+name+' and its whole menu?')) return;
  const res = await jpost('/api/dispatch/restaurant', {op:'delete', restaurant_id:id});
  if(!res.ok) alert(res.error); load();
}
async function addItem(rid){
  await jpost('/api/dispatch/menu-item', {op:'create', restaurant_id:rid,
    name:document.getElementById('in'+rid).value,
    description:document.getElementById('id'+rid).value,
    price_cents: dollars(document.getElementById('ip'+rid).value)});
  load();
}
async function delItem(id){ if(confirm('Delete this item?')){ await jpost('/api/dispatch/menu-item',{op:'delete',item_id:id}); load(); } }
async function toggleItem(id){ await jpost('/api/dispatch/menu-item',{op:'toggle',item_id:id}); load(); }
async function addGroup(itemId){
  await jpost('/api/dispatch/option-group', {op:'create', item_id:itemId,
    name:document.getElementById('gn'+itemId).value,
    min_select:parseInt(document.getElementById('gmin'+itemId).value||'1',10),
    max_select:parseInt(document.getElementById('gmax'+itemId).value||'1',10)});
  load();
}
async function delGroup(gid){ await jpost('/api/dispatch/option-group',{op:'delete',group_id:gid}); load(); }
async function addOption(gid){
  await jpost('/api/dispatch/option', {op:'create', group_id:gid,
    name:document.getElementById('on'+gid).value,
    price_delta_cents: dollars(document.getElementById('op'+gid).value)});
  load();
}
async function delOption(oid){ await jpost('/api/dispatch/option',{op:'delete',option_id:oid}); load(); }

async function addDriver(){
  const name = document.getElementById('dName').value.trim(), ph = document.getElementById('dPhone').value.replace(/\D/g,'');
  if(!name || ph.length < 10){ document.getElementById('dMsg').textContent = 'Type the driver\'s name and a 10 digit phone.'; return; }
  let res;
  try { res = await jpost('/api/dispatch/driver', {op:'create',
    name:document.getElementById('dName').value, phone:document.getElementById('dPhone').value,
    pin:document.getElementById('dPin').value}); }
  catch(e){ document.getElementById('dMsg').textContent = 'Could not reach the server. Refresh and try again.'; return; }
  document.getElementById('dMsg').textContent = res.ok ? 'Driver added.' : (res.error||'Could not add.');
  if(res.ok){ ['dName','dPhone','dPin'].forEach(i=>document.getElementById(i).value=''); loadDrivers(); }
}
async function saveDriver(id){
  const res = await jpost('/api/dispatch/driver', {op:'update', driver_id:id,
    name:document.getElementById('dn'+id).value, phone:document.getElementById('dp'+id).value,
    pin:document.getElementById('dk'+id).value,
    payout_wallet:document.getElementById('dw'+id).value,
    payout_email:document.getElementById('de'+id).value,
    payout_phone:document.getElementById('dv'+id).value,
    payout_branch_id:document.getElementById('dbr'+id).value,
    branch_account_id:(document.getElementById('dba'+id)||{value:0}).value,
    payout_branch_ids:Object.fromEntries(BRANCH_ACCTS.map(a=>[String(a.id),(document.getElementById('dbw'+id+'_'+a.id)||{value:''}).value])),
    auto_pay:document.getElementById('dap'+id).checked?1:0,
    bank_name:document.getElementById('dbn'+id).value,
    bank_last4:document.getElementById('dbl'+id).value});
  if(!res.ok) alert(res.error); loadDrivers();
}
async function setActive(id, on){
  if (!on && !confirm('Make this driver inactive? They will be signed out and cannot sign in, go online or get orders until you make them active again.')) return;
  const res = await jpost('/api/dispatch/driver-active', {driver_id:id, active:on});
  if(!res.ok) alert(res.error); loadDrivers();
}
async function delDriver(id, name){
  if(!confirm('Delete driver '+name+'?')) return;
  let res;
  try { res = await jpost('/api/dispatch/driver', {op:'delete', driver_id:id}); }
  catch(e){ alert('Could not reach the server. Refresh and try again.'); return; }
  if(!res.ok) alert(res.error || 'Could not delete that driver.'); loadDrivers();
}
const INIT_DRIVERS = {{ init_drivers|tojson }};
if (INIT_DRIVERS && INIT_DRIVERS.ok) showDrivers(INIT_DRIVERS); else loadDrivers();
loadRests();
</script>{% endblock %}
