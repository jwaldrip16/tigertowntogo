<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver sign in</title>
<link rel="manifest" href="/manifest/driver.json">
<meta name="theme-color" content="#0f172a">
<link rel="icon" type="image/png" href="{{ logo }}">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f5f6f8;color:#1f2937;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.07);padding:26px 24px;width:100%;max-width:380px;text-align:center}
img{width:84px;height:84px;object-fit:contain}
h1{font-size:22px;margin:10px 0 16px}
input{width:100%;font-size:17px;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-bottom:10px}
button{width:100%;font-size:16px;padding:12px;border:0;border-radius:10px;background:#0f172a;color:#fff;font-weight:600;cursor:pointer}
.bad{color:#b91c1c;font-size:14px;margin:0 0 10px}.good{color:#15803d;font-size:14px;margin:0 0 10px}
.muted{color:#6b7280;font-size:13px;margin:14px 0 0}a{color:#2563eb}
</style></head><body>
<div class="card panel narrow">
  <img src="{{ logo }}" alt="">
  <h1>Driver sign in</h1>
  {% if request.args.get('reset') %}<p class="good">Saved. Sign in with your new PIN.</p>{% endif %}
  {% if err %}<p class="bad">{{ err }}</p>{% endif %}
  <form method="post">
    <input name="phone" placeholder="Mobile number" autofocus>
    <input name="pin" type="password" placeholder="4 digit PIN">
    <button class="btn primary">Sign in</button>
  </form>
  <p class="small"><a href="/reset/driver">Forgot your PIN?</a></p>
</div>
<script src="/static/hubswitch.js"></script>
</body></html>
