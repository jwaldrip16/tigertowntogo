{% extends "base.html" %}{% block body %}
<div class="panel narrow">
  <h1>Restaurant sign in</h1>
  {% if err %}<p class="bad">{{ err }}</p>{% endif %}
  <form method="post">
    <input name="slug" placeholder="Store code" autofocus>
    <input name="pin" type="password" placeholder="PIN">
    <button class="btn primary">Sign in</button>
  </form>
  <p class="muted small">Demo: tigertown / 1111, noodle / 1111, valleybbq / 1111</p>
</div>
{% endblock %}
