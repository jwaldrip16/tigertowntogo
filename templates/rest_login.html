{% extends "base.html" %}{% block body %}
<div class="panel narrow">
  <h1>Restaurant sign in</h1>
  {% if request.args.get('reset') %}<p class="good">Saved. Sign in with your new PIN.</p>{% endif %}
  {% if err %}<p class="bad">{{ err }}</p>{% endif %}
  <form method="post">
    <input name="slug" placeholder="Store code" autofocus>
    <input name="pin" type="password" placeholder="PIN">
    <button class="btn primary">Sign in</button>
  </form>
  <p class="small"><a href="/reset/restaurant">Forgot your PIN?</a></p>
  <p class="muted small">Ask dispatch for your store code and PIN.</p>
</div>
<script src="/static/hubswitch.js"></script>
{% endblock %}
